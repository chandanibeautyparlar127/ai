<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>SB2 Online Shop</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            min-height: 100vh;
            background: #1a1a2e;
            color: #fff;
            overflow-x: hidden;
        }

        /* ----- NAVBAR ----- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
            background: rgba(26, 26, 46, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            transform: translateY(-100%);
            animation: slideDown 0.8s ease forwards;
        }
        @media (min-width: 768px) {
            .navbar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 15px 30px;
            }
        }
        @keyframes slideDown {
            to {
                transform: translateY(0);
            }
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        @media (min-width: 768px) {
            .logo-section {
                flex-direction: row;
                width: auto;
            }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .logo i {
            font-size: 2rem;
            color: #00d4ff;
            filter: drop-shadow(0 0 10px #00d4ff);
            animation: glow 2s ease-in-out infinite;
        }
        @keyframes glow {
            0%,
            100% {
                filter: drop-shadow(0 0 10px #00d4ff);
            }
            50% {
                filter: drop-shadow(0 0 20px #00d4ff);
            }
        }
        .logo h1 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #fff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo span {
            font-size: 0.7rem;
            color: #00d4ff;
        }

        .social-media {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }
        @media (min-width: 768px) {
            .social-media {
                width: auto;
                margin-left: 20px;
            }
        }

        .social-icon {
            width: 35px;
            height: 35px;
            border: 2px solid #00d4ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            font-size: 0.9rem;
        }
        .social-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #00d4ff;
            transition: 0.3s;
            z-index: -1;
        }
        .social-icon:hover::before {
            left: 0;
        }
        .social-icon:hover {
            color: #1a1a2e;
            transform: translateY(-5px);
            box-shadow: 0 0 20px #00d4ff;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex-wrap: wrap;
        }
        @media (min-width: 768px) {
            .nav-links {
                width: auto;
                gap: 20px;
            }
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            position: relative;
            padding: 5px 0;
            transition: 0.3s;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #00d4ff;
            transition: 0.3s;
            box-shadow: 0 0 10px #00d4ff;
        }
        .nav-links a:hover::before {
            width: 100%;
        }
        .nav-links a:hover {
            color: #00d4ff;
        }

        .nav-links .cart-link {
            position: relative;
        }
        .nav-links .cart-link .cart-count {
            position: absolute;
            top: -8px;
            right: -12px;
            background: #ff4444;
            color: #fff;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .nav-links .premium-btn {
            border: 2px solid #00d4ff;
            padding: 6px 15px;
            border-radius: 40px;
            background: transparent;
            transition: 0.3s;
            cursor: pointer;
        }
        .nav-links .premium-btn:hover {
            background: #00d4ff;
            color: #1a1a2e;
            box-shadow: 0 0 20px #00d4ff;
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            color: #00d4ff;
            cursor: pointer;
        }

        .main-container {
            margin-top: 180px;
            padding: 15px;
        }
        @media (min-width: 768px) {
            .main-container {
                margin-top: 120px;
                padding: 20px 30px;
            }
        }

        /* ----- SEARCH & FILTER ----- */
        .search-filter-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00d4ff;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        @media (min-width: 768px) {
            .search-filter-section {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 5px 15px;
            border: 1px solid #00d4ff;
        }
        .search-box input {
            flex: 1;
            padding: 12px 10px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .search-box input::placeholder {
            color: #6c6c8a;
        }
        .search-box i {
            color: #00d4ff;
            font-size: 1.2rem;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 18px;
            border: 2px solid #00d4ff;
            border-radius: 30px;
            background: transparent;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }
        .filter-btn:hover,
        .filter-btn.active {
            background: #00d4ff;
            color: #1a1a2e;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        /* ----- HERO ----- */
        .hero-section {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00d4ff;
            border-radius: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        .hero-section h1 {
            font-size: 2rem;
            background: linear-gradient(45deg, #fff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .hero-section p {
            color: #00d4ff;
            font-size: 1rem;
            opacity: 0.8;
        }
        .hero-section .whatsapp-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: #25D366;
            color: #fff;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }
        .hero-section .whatsapp-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(37, 211, 102, 0.5);
        }

        /* ----- PRODUCTS ----- */
        .section-title {
            font-size: 1.5rem;
            color: #00d4ff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00d4ff;
            border-radius: 15px;
            padding: 15px;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            background: #1a1a2e;
        }
        .product-card .new-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4444;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .product-card h3 {
            font-size: 1.1rem;
            margin: 10px 0 5px;
            color: #fff;
        }
        .product-card .category {
            color: #00d4ff;
            font-size: 0.8rem;
            opacity: 0.8;
        }
        .product-card .price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #00d4ff;
            margin: 8px 0;
        }
        .product-card .stock-status {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .product-card .stock-status.in-stock {
            background: rgba(40, 167, 69, 0.3);
            color: #28a745;
            border: 1px solid #28a745;
        }
        .product-card .stock-status.out-of-stock {
            background: rgba(220, 53, 69, 0.3);
            color: #dc3545;
            border: 1px solid #dc3545;
        }
        .product-card .add-to-cart {
            width: 100%;
            padding: 10px;
            border: 2px solid #00d4ff;
            border-radius: 30px;
            background: transparent;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .product-card .add-to-cart:hover:not(:disabled) {
            background: #00d4ff;
            color: #1a1a2e;
            box-shadow: 0 0 20px #00d4ff;
        }
        .product-card .add-to-cart:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .product-card .add-to-cart:disabled:hover {
            background: transparent;
            color: #fff;
            box-shadow: none;
        }

        .no-products {
            color: #6c6c8a;
            text-align: center;
            grid-column: 1/-1;
            padding: 40px 0;
            font-size: 1.1rem;
        }

        /* ----- AUTH MODAL - ONLY GOOGLE SIGN-IN ----- */
        .auth-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .auth-modal.active {
            display: flex;
        }

        .auth-box {
            background: #1a1a2e;
            border: 2px solid #00d4ff;
            border-radius: 20px;
            padding: 40px 30px;
            width: 400px;
            max-width: 92%;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.2);
            text-align: center;
        }
        .auth-box h2 {
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        .auth-box .sub-text {
            color: #6c6c8a;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .auth-box .google-btn {
            width: 100%;
            padding: 14px;
            background: #fff;
            border: none;
            border-radius: 30px;
            color: #1a1a2e;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.1rem;
        }
        .auth-box .google-btn:hover {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }
        .auth-box .google-btn i {
            font-size: 1.4rem;
        }

        .auth-box .user-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid #00d4ff;
        }
        .auth-box .user-info p {
            color: #fff;
            font-size: 0.9rem;
            margin: 5px 0;
        }
        .auth-box .user-info .name {
            color: #00d4ff;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .auth-box .logout-btn {
            margin-top: 15px;
            padding: 10px 30px;
            background: #ff4444;
            border: none;
            border-radius: 30px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .auth-box .logout-btn:hover {
            background: #cc0000;
            transform: scale(1.02);
        }

        /* Error message hide */
        .auth-error {
            display: none !important;
        }

        /* ----- CART SIDEBAR ----- */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100%;
            background: #1a1a2e;
            border-left: 2px solid #00d4ff;
            z-index: 2000;
            padding: 20px;
            transition: right 0.3s ease;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }
        .cart-sidebar.open {
            right: 0;
        }
        .cart-sidebar .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #00d4ff;
        }
        .cart-sidebar .cart-header h2 {
            color: #00d4ff;
        }
        .cart-sidebar .close-cart {
            font-size: 1.5rem;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }
        .cart-sidebar .close-cart:hover {
            color: #ff4444;
            transform: rotate(90deg);
        }

        .cart-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .cart-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }
        .cart-item .item-details {
            flex: 1;
        }
        .cart-item .item-details h4 {
            font-size: 0.9rem;
            color: #fff;
        }
        .cart-item .item-details .item-price {
            color: #00d4ff;
            font-weight: 600;
        }
        .cart-item .item-details .item-qty {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }
        .cart-item .item-details .item-qty button {
            width: 25px;
            height: 25px;
            border: 1px solid #00d4ff;
            border-radius: 50%;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }
        .cart-item .item-details .item-qty button:hover {
            background: #00d4ff;
            color: #1a1a2e;
        }
        .cart-item .remove-item {
            color: #ff4444;
            cursor: pointer;
            transition: 0.3s;
        }
        .cart-item .remove-item:hover {
            transform: scale(1.2);
        }

        .cart-total {
            padding: 20px 0;
            border-top: 2px solid #00d4ff;
            margin-top: 20px;
        }
        .cart-total h3 {
            color: #fff;
            display: flex;
            justify-content: space-between;
        }
        .cart-total h3 span {
            color: #00d4ff;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            border: 2px solid #00d4ff;
            border-radius: 30px;
            background: #00d4ff;
            color: #1a1a2e;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }
        .checkout-btn:hover {
            background: transparent;
            color: #fff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .empty-cart {
            text-align: center;
            padding: 40px 0;
            color: #6c6c8a;
        }
        .empty-cart i {
            font-size: 3rem;
            color: #00d4ff;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* ----- TOAST ----- */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            color: #fff;
            z-index: 9999;
            display: none;
            animation: slideUp 0.5s ease;
            backdrop-filter: blur(10px);
            max-width: 90%;
        }
        .toast.show {
            display: block;
        }
        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ----- BACK TO TOP ----- */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #00d4ff, #00a8cc);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a2e;
            text-decoration: none;
            font-size: 1.2rem;
            box-shadow: 0 0 30px #00d4ff;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 998;
            border: none;
            cursor: pointer;
        }
        .back-to-top.show {
            opacity: 1;
            visibility: visible;
        }
        .back-to-top:hover {
            transform: translateY(-5px);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }
            .cart-sidebar {
                width: 100%;
                right: -100%;
            }
            .menu-toggle {
                display: block;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                padding: 20px 0;
            }
            .nav-links.active {
                display: flex;
            }
            .search-filter-section {
                padding: 15px;
            }
            .filter-buttons {
                justify-content: center;
            }
            .auth-box {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <!-- ===== AUTH MODAL - ONLY GOOGLE SIGN-IN ===== -->
    <div id="authModal" class="auth-modal">
        <div class="auth-box">
            <h2><i class="fas fa-user-circle" style="color:#00d4ff;"></i> SB2 Online Shop</h2>
            <p class="sub-text">Sign in with Google to continue</p>

            <div id="authContent">
                <button class="google-btn" onclick="googleSignIn()">
                    <i class="fab fa-google" style="color: #ea4335;"></i> Continue with Google
                </button>
            </div>

            <div id="userInfo" style="display:none;">
                <div class="user-info">
                    <p class="name" id="userName">Loading...</p>
                    <p id="userEmail">Loading...</p>
                </div>
                <button class="logout-btn" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="logo-section">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <div>
                    <h1>SB2 Online Shop</h1>
                    <span>Shop & Learn</span>
                </div>
            </div>
            <div class="social-media">
                <a href="https://www.instagram.com/backlock_2024?igsh=MWMzc29leG45dmJqbQ==" class="social-icon" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://www.facebook.com/profile.php?id=61579322197572&mibextid=ZbWKwL" class="social-icon" title="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="https://t.me/animesupperworld" class="social-icon" title="Telegram"><i class="fab fa-telegram-plane"></i></a>
                <a href="https://x.com/solutionenjo127" class="social-icon" title="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="https://pin.it/1LF1j46WC" class="social-icon" title="Pinterest"><i class="fab fa-pinterest"></i></a>
                <a href="https://youtube.com" class="social-icon" title="YouTube"><i class="fab fa-youtube"></i></a>
                <a href="https://surajlabai.github.io/suraj" class="social-icon" title="Portfolio"><i class="fas fa-briefcase"></i></a>
            </div>
        </div>
        <div class="nav-links" id="navLinks">
            <a onclick="navigateTo('home')"><i class="fas fa-home"></i> Home</a>
            <a onclick="joinWhatsApp()"><i class="fab fa-whatsapp"></i> WhatsApp Channel</a>
            <a class="cart-link" onclick="toggleCart()"><i class="fas fa-shopping-cart"></i> Cart <span class="cart-count" id="cartCount">0</span></a>
            <a class="premium-btn" onclick="openProfile()" id="profileBtn">
                <i class="fas fa-user"></i> <span id="userBtnText">Profile</span>
            </a>
        </div>
        <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    </nav>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="main-container">
        <div id="homeSection">
            <div class="hero-section">
                <h1>Welcome to SB2 Online Shop</h1>
                <p>Discover premium products at the best prices</p>
                <button class="whatsapp-btn" onclick="joinWhatsApp()"><i class="fab fa-whatsapp"></i> Join WhatsApp Group</button>
            </div>

            <!-- Search & Filter -->
            <div class="search-filter-section">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search products..." oninput="filterProducts()">
                </div>
                <div class="filter-buttons" id="categoryFilters">
                    <button class="filter-btn active" data-category="all" onclick="filterByCategory('all')">All</button>
                    <button class="filter-btn" data-category="skin care" onclick="filterByCategory('skin care')">Skin Care</button>
                    <button class="filter-btn" data-category="Hair care" onclick="filterByCategory('Hair care')">Hair Care</button>
                    <button class="filter-btn" data-category="shop and cream" onclick="filterByCategory('shop and cream')">Shop & Cream</button>
                    <button class="filter-btn" data-category="home" onclick="filterByCategory('home')">Home</button>
                </div>
            </div>

            <h2 class="section-title"><i class="fas fa-fire" style="color: #ff4444;"></i> All Products</h2>
            <div class="products-grid" id="allProducts">
                <p style="color: #6c6c8a; text-align: center; grid-column: 1/-1;">Loading products...</p>
            </div>
        </div>
    </div>

    <!-- ===== CART SIDEBAR ===== -->
    <div id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2><i class="fas fa-shopping-cart"></i> Your Cart</h2>
            <span class="close-cart" onclick="toggleCart()"><i class="fas fa-times"></i></span>
        </div>
        <div id="cartItems"><div class="empty-cart"><i class="fas fa-shopping-bag"></i><p>Your cart is empty</p></div></div>
        <div class="cart-total" id="cartTotalSection" style="display:none;">
            <h3>Total: <span id="cartTotal">₹0</span></h3>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fas fa-arrow-up"></i></button>

    <script>
        // ============================================
        // FIREBASE CONFIG
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBWboop2NtbdfGyjfAYabWXM09V9U3xVdo",
            authDomain: "online-shopping-c3081.firebaseapp.com",
            databaseURL: "https://online-shopping-c3081-default-rtdb.firebaseio.com",
            projectId: "online-shopping-c3081",
            storageBucket: "online-shopping-c3081.firebasestorage.app",
            messagingSenderId: "652206097848",
            appId: "1:652206097848:web:36433c60a35f1df296bb4d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        // ============================================
        // GLOBAL VARIABLES
        // ============================================
        let currentUser = null;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let allProducts = [];
        let currentCategory = 'all';
        let searchQuery = '';

        // ============================================
        // TOAST
        // ============================================
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.borderColor = isError ? '#ff6b6b' : '#00d4ff';
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ============================================
        // AUTH - GOOGLE SIGN-IN (No error messages)
        // ============================================
        function googleSignIn() {
            auth.signInWithPopup(googleProvider)
                .then(result => {
                    currentUser = result.user;
                    saveUserToDB(currentUser);
                    updateProfileUI();
                    document.getElementById('authModal').classList.remove('active');
                    // ✅ Success message - only success, no error
                    showToast('✅ Welcome ' + currentUser.displayName + '! 🎉');
                })
                .catch(err => {
                    // ❌ Error message completely hidden - no error shown to user
                    // Silently fail - user sees nothing
                    console.log('Sign-in error (silent):', err.message);
                });
        }

        // ✅ Profile automatically create hoti hai Google se aaye name se
        function saveUserToDB(user) {
            const uid = user.uid;
            db.ref('users/' + uid).set({
                name: user.displayName || 'User',
                email: user.email || '',
                photoURL: user.photoURL || '',
                createdAt: new Date().toISOString(),
                lastLogin: new Date().toISOString()
            });
        }

        function logoutUser() {
            auth.signOut();
            currentUser = null;
            updateProfileUI();
            document.getElementById('authModal').classList.remove('active');
            showToast('Logged out');
        }

        // ============================================
        // PROFILE UI
        // ============================================
        function openProfile() {
            document.getElementById('authModal').classList.add('active');
            updateProfileUI();
        }

        function updateProfileUI() {
            const user = auth.currentUser;
            const authContent = document.getElementById('authContent');
            const userInfo = document.getElementById('userInfo');
            const userBtnText = document.getElementById('userBtnText');

            if (user) {
                currentUser = user;
                authContent.style.display = 'none';
                userInfo.style.display = 'block';
                document.getElementById('userName').textContent = user.displayName || 'User';
                document.getElementById('userEmail').textContent = user.email || '';
                userBtnText.textContent = user.displayName || 'User';
                document.getElementById('profileBtn').innerHTML = '<i class="fas fa-user"></i> ' + (user.displayName || 'User');
            } else {
                currentUser = null;
                authContent.style.display = 'block';
                userInfo.style.display = 'none';
                userBtnText.textContent = 'Profile';
                document.getElementById('profileBtn').innerHTML = '<i class="fas fa-user"></i> Profile';
            }
        }

        // Auth state listener - automatically detect login/logout
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                updateProfileUI();
                loadProducts();
            } else {
                currentUser = null;
                updateProfileUI();
            }
        });

        // ============================================
        // WHATSAPP
        // ============================================
        function joinWhatsApp() {
            if (!currentUser) {
                showToast('⚠️ Please login with Google first', true);
                document.getElementById('authModal').classList.add('active');
                return;
            }
            window.open('https://chat.whatsapp.com/YOUR_GROUP_LINK', '_blank');
            showToast('✅ Joining WhatsApp group... 🎉');
        }

        // ============================================
        // PRODUCTS
        // ============================================
        function loadProducts() {
            const grid = document.getElementById('allProducts');
            grid.innerHTML = '<p style="color: #6c6c8a; text-align: center; grid-column: 1/-1;">Loading products...</p>';

            db.ref('products').on('value', (snapshot) => {
                const products = snapshot.val();

                if (!products) {
                    grid.innerHTML = '<p class="no-products">No products available</p>';
                    return;
                }

                allProducts = Object.keys(products).map(key => ({ id: key, ...products[key] }));
                renderProducts(allProducts);
            });
        }

        function renderProducts(products) {
            const grid = document.getElementById('allProducts');
            grid.innerHTML = '';

            let filtered = products;
            if (currentCategory !== 'all') {
                filtered = filtered.filter(p => p.category && p.category.toLowerCase() === currentCategory.toLowerCase());
            }

            if (searchQuery.trim() !== '') {
                const query = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(p =>
                    p.name.toLowerCase().includes(query) ||
                    (p.category && p.category.toLowerCase().includes(query)) ||
                    (p.description && p.description.toLowerCase().includes(query))
                );
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<p class="no-products">No products found matching your criteria</p>';
                return;
            }

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                const inStock = product.stock && product.stock > 0;

                card.innerHTML = `
                    ${product.isNew ? '<span class="new-badge">NEW</span>' : ''}
                    <img src="${product.image || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&q=80'}" alt="${product.name}" />
                    <h3>${product.name}</h3>
                    <div class="category">${product.category || 'General'}</div>
                    <div class="price">₹${product.price}</div>
                    <span class="stock-status ${inStock ? 'in-stock' : 'out-of-stock'}">
                        ${inStock ? '✅ In Stock' : '❌ Out of Stock'}
                    </span>
                    <button class="add-to-cart" ${!inStock ? 'disabled' : ''} onclick="addToCart('${product.id}', '${product.name}', ${product.price}, '${product.image || ''}')">
                        ${inStock ? '🛒 Add to Cart' : 'Out of Stock'}
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        // ============================================
        // SEARCH & FILTER
        // ============================================
        function filterProducts() {
            searchQuery = document.getElementById('searchInput').value;
            renderProducts(allProducts);
        }

        function filterByCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.category === category) {
                    btn.classList.add('active');
                }
            });
            renderProducts(allProducts);
        }

        // ============================================
        // NAVIGATION
        // ============================================
        function navigateTo(section) {
            if (section === 'home') {
                loadProducts();
            }
            document.getElementById('navLinks').classList.remove('active');
        }

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        // ============================================
        // CART
        // ============================================
        function addToCart(id, name, price, image) {
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id, name, price, image, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
            showToast('✅ ' + name + ' added to cart! 🛒');
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = totalItems;

            const container = document.getElementById('cartItems');
            const totalSection = document.getElementById('cartTotalSection');

            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-cart"><i class="fas fa-shopping-bag"></i><p>Your cart is empty</p></div>';
                totalSection.style.display = 'none';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                html += `
                    <div class="cart-item">
                        <img src="${item.image || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=100&q=80'}" alt="${item.name}" />
                        <div class="item-details">
                            <h4>${item.name}</h4>
                            <div class="item-price">₹${item.price}</div>
                            <div class="item-qty">
                                <button onclick="updateQuantity(${index}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQuantity(${index}, 1)">+</button>
                            </div>
                        </div>
                        <span class="remove-item" onclick="removeFromCart(${index})"><i class="fas fa-trash"></i></span>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('cartTotal').textContent = total;
            totalSection.style.display = 'block';
        }

        function updateQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
            updateCartUI();
        }

        function checkout() {
            if (!currentUser) {
                showToast('⚠️ Please login with Google first', true);
                document.getElementById('authModal').classList.add('active');
                return;
            }

            if (cart.length === 0) {
                showToast('⚠️ Your cart is empty', true);
                return;
            }

            const order = {
                userId: currentUser.uid,
                userName: currentUser.displayName || 'Guest',
                userEmail: currentUser.email || '',
                items: cart,
                total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0),
                status: 'pending',
                createdAt: new Date().toISOString()
            };

            db.ref('orders').push(order).then(() => {
                cart = [];
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCartUI();
                toggleCart();
                showToast('✅ Order placed successfully! 🎉');
            });
        }

        // ============================================
        // INIT
        // ============================================
        function init() {
            updateCartUI();
            loadProducts();
            updateProfileUI();

            window.addEventListener('scroll', () => {
                const btn = document.getElementById('backToTop');
                if (window.scrollY > 500) {
                    btn.classList.add('show');
                } else {
                    btn.classList.remove('show');
                }
            });

            document.getElementById('authModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) {
                    document.getElementById('authModal').classList.remove('active');
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
